<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>

    <style>
      body {
        font-family: sans-serif;
        margin: 0;
        padding: 0;
      }
      header {
        display: flex;
        justify-content: space-between;
        padding: 20px;
        background: #eee;
      }
      #hero {
        display: flex;
        padding: 50px;
      }
      .hero-image-container {
        width: 50%;
      }
    </style>
    <link rel="stylesheet" href="css/styles-unoptimized.css" />

    <script>
      // ❌ INP KILLER: Blocks the browser main thread during early parsing
      function blockMainThread(ms) {
        const start = Date.now();
        while (Date.now() - start < ms) {}
      }
      blockMainThread(400);
    </script>
    <script src="js/main-unoptimized.js"></script>
  </head>
  <body>
    <div id="header-wrapper">
      <div class="logo">Meridian Dental</div>
      <div class="links">
        <a href="#">Services</a> | <a href="#">About</a> |
        <a href="#">Contact</a>
      </div>
    </div>

    <div id="main-body">
      <div id="hero-banner">
        <!-- ❌ Duplicate H1 tags -->
        <h1>Meridian Dental Arts</h1>
        <h1>Best Local Dentist Services</h1>

        <p>
          We provide standard dental cleanings. Contact us today for an
          appointment.
        </p>

        <div class="hero-image-container">
          <!-- ❌ CLS TRAP: Missing dimensions & heavy uncompressed legacy image -->
          <img src="images/raw-uncompressed-dental-photo.jpg" />
        </div>
      </div>

      <h4>Our Work</h4>
      <div class="service-item">
        <span style="font-size: 20px; font-weight: bold">Teeth Cleaning</span>
        <p>Routine family care checkups.</p>
      </div>

      <div id="contact-form-section">
        <h2>Book Now</h2>
        <!-- ❌ Wipes out dataLayer history tracking via standard refresh -->
        <form action="/success.html" onsubmit="alert('Appointment Requested!')">
          <input type="text" placeholder="Name" required />
          <input type="email" placeholder="Email" required />
          <button type="submit">Submit</button>
        </form>
      </div>
    </div>

    <div id="footer-bottom">
      <p>Copyright 2026. Meridian Dental Mesquite TX.</p>
    </div>
  </body>
</html>
